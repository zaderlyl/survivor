<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Neon Horde</title>
    <meta
      name="description"
      content="Survivor-like cyberpunk : tiens le plus longtemps possible, monde après monde"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neon Horde" />
    <meta property="og:title" content="Neon Horde" />
    <meta
      property="og:description"
      content="Survivor-like cyberpunk : tiens le plus longtemps possible, monde après monde"
    />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <a class="logo" href="#"><i></i>neon horde</a>
      <div class="right">
        <span class="stat" id="sTime" aria-hidden="true">0:00</span>
        <span class="stat" id="sWorld" aria-hidden="true">monde 1</span>
        <span class="stat" id="sLevel" aria-hidden="true">niv 1</span>
        <span class="stat" id="sKills" aria-hidden="true">0 tués</span>
        <button class="btn" id="sound" type="button" aria-label="Son" aria-pressed="true">son</button>
        <button class="btn" id="pause" type="button" aria-label="Mettre en pause" hidden>pause</button>
        <button class="btn" id="help" type="button" aria-label="Comment jouer">?</button>
      </div>
    </header>

    <main id="stage">
      <div class="play" id="play">
        <canvas id="cv" role="img" aria-label="Le jeu : ton personnage au centre, des ennemis qui arrivent de partout"></canvas>

        <div class="bars" id="bars" hidden>
          <div class="bar hp" id="hpBar"><i id="hpFill"></i></div>
          <div class="bar xp" id="xpBar"><i id="xpFill"></i></div>
          <div class="bar dash" id="dashBar"><i id="dashFill"></i></div>
          <span class="hptxt" id="hpTxt" aria-hidden="true"></span>
          <span class="scoretxt" id="scoreTxt" aria-hidden="true"></span>
        </div>
        <div class="bossbar" id="bossBar" hidden><span>boss</span><div class="bar"><i id="bossFill"></i></div></div>
        <p class="chips" id="chips" aria-hidden="true"></p>
        <button class="dashbtn" id="dashBtn" type="button" aria-label="Dash (touche Espace)" hidden>dash</button>

        <p class="banner" id="banner" hidden></p>

        <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
          <p class="mark" id="pTitle"></p>
          <div id="pBody"></div>
        </div>
      </div>
      <p class="sr" id="live" role="status" aria-live="polite"></p>
    </main>

    <footer class="foot">
      <p><span class="mark">crédits</span> Basé sur <a href="https://github.com/Bebbou/devtober-2026/tree/main/07-Swarm">Swarm de Lino Volle</a>. Inspiré du mode Swarm de League of Legends : aucun élément de Riot Games n'est utilisé.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/ameliorations.js"></script>
    <script src="js/armes.js"></script>
    <script src="js/universelles.js"></script>
    <script src="js/uniques.js"></script>
    <script src="js/uniques-chrome.js"></script>
    <script src="js/uniques-rig.js"></script>
    <script src="js/uniques-ghost.js"></script>
    <script src="js/uniques-arc.js"></script>
    <script src="js/uniques-pulse.js"></script>
    <script src="js/uniques-zap.js"></script>
    <script src="js/uniques-2-chrome-rig.js"></script>
    <script src="js/persos.js"></script>
    <script src="js/etat.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/monstres-rues.js"></script>
    <script src="js/monstres-egouts.js"></script>
    <script src="js/monstres-usine.js"></script>
    <script src="js/monstres-cyber.js"></script>
    <script src="js/monstres-corpo.js"></script>
    <script src="js/persos-art.js"></script>
    <script src="js/effets.js"></script>
    <script src="js/decors.js"></script>
    <script src="js/ecrans.js"></script>
    <script src="js/entrees.js"></script>
    <script src="js/partie.js"></script>
    <script src="js/rendu.js"></script>
    <script src="js/depart.js"></script>
  </body>
</html>
